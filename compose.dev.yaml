# Desenvolvimento com recarga automática:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app/backend
    command: ["sh", "-c", "uv run --no-sync python -m backend.cli init-db && exec uv run --no-sync uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend"]
  web:
    build:
      target: dev
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports: !override
      - "127.0.0.1:3000:3000"

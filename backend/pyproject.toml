[project]
name = "eja-backend"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic[email]>=2.10,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.coverage.run]
omit = ["*/tests/*"]

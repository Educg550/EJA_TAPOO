services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eja
      POSTGRES_USER: eja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eja -d eja"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eja:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db/eja
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run --no-sync python -m backend.cli init-db && exec uv run --no-sync uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
volumes:
  postgres:
